name: CI Docker Django React

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env << 'EOF'
          FRONTEND_PORT=5173
          BACKEND_PORT=8000
          PHPMYADMIN_PORT=8081
          MYSQL_PUBLIC_PORT=3307

          DJANGO_SETTINGS_MODULE=config.settings.dev
          DJANGO_SECRET_KEY=ci_dummy_secret_key_not_real
          DJANGO_DEBUG=True
          DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost,backend

          MYSQL_DATABASE=ci_cyber_manager
          MYSQL_USER=ci_cyber_user
          MYSQL_PASSWORD=ci_dummy_password
          MYSQL_ROOT_PASSWORD=ci_dummy_root_password
          MYSQL_HOST=db
          MYSQL_PORT=3306
          MYSQL_CONN_MAX_AGE=60

          DJANGO_SUPERUSER_USERNAME=admin
          DJANGO_SUPERUSER_EMAIL=admin@example.com
          DJANGO_SUPERUSER_PASSWORD=ci_dummy_admin_password

          MIKROTIK_BASE_URL=http://192.168.88.1/rest
          MIKROTIK_USERNAME=dummy
          MIKROTIK_PASSWORD=dummy
          MIKROTIK_VERIFY_SSL=false
          MIKROTIK_HOTSPOT_PROFILE=dummy_profile
          MIKROTIK_ENABLE_HOTSPOT_SYNC=false

          CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          CSRF_TRUSTED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          CORS_ALLOWED_ORIGIN_REGEXES=^http://127\.0\.0\.1:5173$

          VITE_API_BASE_URL=http://localhost:8000
          EOF

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

      - name: Start database
        run: docker compose up -d db

      - name: Run Django check
        run: docker compose run --rm backend python manage.py check

      - name: Run Django migrations
        run: docker compose run --rm backend python manage.py migrate

      - name: Build frontend
        run: docker compose run --rm frontend npm run build

      - name: Stop containers
        if: always()
        run: docker compose down -v