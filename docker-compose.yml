services:
  db:
    image: mariadb:11.4
    container_name: cyber_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PUBLIC_PORT:-3307}:3306"
    volumes:
      - cyber_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u\"$${MARIADB_USER}\" -p\"$${MARIADB_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./django_mysql_backend_swagger/backend
      dockerfile: Dockerfile
    container_name: cyber_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client_management_frontend_for_django_mysql
      dockerfile: Dockerfile
    container_name: cyber_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    container_name: cyber_backup
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Indian/Antananarivo
    volumes:
      - type: bind
        source: ./backups
        target: /backup
    depends_on:
      db:
        condition: service_healthy

volumes:
  cyber_db_data:
